# Dependabot version updates.
#
# The schedules below only pace routine version bumps. Security updates (PRs
# opened as soon as an advisory affects a locked dependency) ignore them and
# are switched on separately under Settings → Code security: enable both
# "Dependabot alerts" and "Dependabot security updates".
#
# Deliberately not covered, because their update procedure spans files that
# Dependabot does not know about:
# - docker: the base-image digest in tools/reproducible-builds/Dockerfile has
#   to move together with JAVA_VERSION and the archive checksums in
#   TOOLCHAIN.env (docs/reproducible-builds.md, "Updating dependencies or
#   toolchains"). Dependabot would only rewrite the FROM line, and nothing in
#   CI catches the two drifting apart.
# - cargo: tools/arti-build depends on an Arti checkout through path
#   dependencies and ships prebuilt libraries checked against SHA256SUMS; see
#   tools/arti-build/README.md.
# - npm: firestore-tests/ only runs the Firestore rules tests and is not part
#   of the app.
version: 2
updates:
  # PR CI only runs android-build.yml. release.yml runs on tags, so a breaking
  # major of an action it uses (attest-build-provenance, upload/download-
  # artifact) would only surface at release time. Majors stay ungrouped so
  # each one gets its own review against release.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      github-actions:
        update-types: [minor, patch]

  # Dependabot edits gradle/libs.versions.toml but cannot regenerate the
  # strict gradle.lockfile files or gradle/verification-metadata.xml, so these
  # PRs fail CI until someone checks out the branch, runs the
  # --write-locks --write-verification-metadata sha256 commands from
  # docs/reproducible-builds.md, reviews every new checksum, and pushes the
  # result. Major updates stay ungrouped so each one gets its own review.
  #
  # The gradle ecosystem also bumps gradle/wrapper/gradle-wrapper.properties.
  # Such a PR must also move GRADLE_VERSION in TOOLCHAIN.env, which
  # BUILDINFO.json reports; build-release.sh fails the reproducible build
  # until it does.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      gradle-minor-and-patch:
        update-types: [minor, patch]

  # Flutter itself is pinned in TOOLCHAIN.env and is not managed here. A bump
  # that pulls in a new flutter_inappwebview_android has to redo its patch in
  # tools/reproducible-builds/apply-pub-cache-patches.sh, which is keyed to
  # the 1.1.3 file checksums. Plugins with Android code can also add Gradle
  # artifacts, which then need the same lock and verification refresh as above.
  - package-ecosystem: pub
    directory: /flutter_ui
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
    groups:
      pub-minor-and-patch:
        update-types: [minor, patch]
