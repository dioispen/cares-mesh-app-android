<rect class="surface" x="0" y="0" width="900" height="448" rx="8"/>
<text class="t1" x="64" y="26" font-size="15" font-weight="600">B、C、D 收到 A 廣播的 RSSI（dBm，每分鐘中位數）</text>
<text class="t2" x="64" y="46" font-size="12">斷開處是該分鐘沒有任何掃描樣本。A 定點，B、C、D 走遠再走回；點位時間沒有記錄，起伏只能對照連線事件解讀。</text>
